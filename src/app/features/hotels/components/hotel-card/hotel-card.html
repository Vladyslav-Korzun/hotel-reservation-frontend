<article class="card hotel-card h-100">
  <div class="hotel-card__media ratio ratio-4x3">
    <img class="hotel-card__image" [src]="imageUrl()" [alt]="imageAlt()" loading="lazy" />
  </div>

  <div class="card-body d-flex flex-column p-3 p-md-4">
    <p class="hotel-card__location mb-2">{{ locationLabel() }}</p>
    <h2 class="hotel-card__title mb-3">{{ hotel().name }}</h2>

    <p class="hotel-card__description mb-4">{{ hotel().description || hotel().address }}</p>

    <div class="d-flex flex-wrap gap-2 mb-4" aria-label="Hotel details">
      <span class="badge hotel-badge">{{ starsLabel() }}</span>
      <span class="badge hotel-badge">{{ childrenPolicyLabel() }}</span>
      <span class="badge hotel-badge">{{ petsPolicyLabel() }}</span>
      <span class="badge hotel-badge">{{ statusLabel() }}</span>
    </div>

    <div class="d-flex flex-column flex-sm-row gap-2 mt-auto">
      <a class="btn btn-brand flex-grow-1" routerLink="/stays/search" [queryParams]="searchParams()">
        Check availability
      </a>
      <a class="btn btn-brand-outline" [routerLink]="['/hotels', hotel().hotelId]">Discover more</a>
    </div>
  </div>
</article>
