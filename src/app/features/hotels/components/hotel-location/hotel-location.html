@let h = hotel();

<div class="hotel-location">
  <div class="hotel-location__address">
    <span class="hotel-location__pin" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </span>
    <div>
      <div class="hotel-location__line">{{ h.address }}</div>
      <div class="hotel-location__sub">{{ h.city }}, {{ h.country }}</div>
    </div>
  </div>

  <p class="hotel-location__note muted">
    Nearby attractions and travel times are not yet listed for this hotel.
  </p>
</div>
