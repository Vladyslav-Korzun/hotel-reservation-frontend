<form class="card find-reservation-card find-reservation-form dark-form" [formGroup]="form()" (ngSubmit)="submitted.emit()">
  <div class="form-row">
    <label class="form-label" for="reservationId">Reservation ID</label>
    <input
      class="form-control"
      id="reservationId"
      type="text"
      autocomplete="off"
      formControlName="reservationId"
      placeholder="af884cad-7b10-4e17-ad82-551a23020ffe"
    />
    @if (canViewAllReservations()) {
      <span class="form-text field-hint">Leave this field empty to load all reservations.</span>
    } @else {
      <span class="form-text field-hint">Use the reservation ID from create response or detail page.</span>
    }
  </div>

  <div class="d-flex flex-wrap gap-2 find-reservation-form__actions">
    <button type="submit" class="btn btn-brand-light">Open reservation</button>
    @if (canViewAllReservations()) {
      <button type="button" class="btn btn-brand-outline" (click)="showAllRequested.emit()">Show all reservations</button>
    }
  </div>
</form>
