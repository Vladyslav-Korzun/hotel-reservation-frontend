<form class="stay-search" [class.compact]="compact()" [formGroup]="form" (ngSubmit)="submit()">

  @if (showLocationFields()) {
    <app-search-select-field
      #cityField
      iconClass="field-icon--search"
      [displayLabel]="cityDisplayLabel()"
      [control]="form.controls.destination"
      ariaLabel="City"
      [options]="citySelectOptions()"
      (opened)="closeOtherPickers(cityField)"
    />

    <app-search-select-field
      #hotelField
      iconClass="field-icon--hotel-id"
      [displayLabel]="hotelDisplayLabel()"
      [control]="form.controls.hotelId"
      ariaLabel="Hotel"
      [options]="hotelSelectOptions()"
      (opened)="closeOtherPickers(hotelField)"
    />
  }

  <app-date-range-picker
    [compact]="compact()"
    [checkInControl]="form.controls.checkIn"
    [checkOutControl]="form.controls.checkOut"
    [rangeError]="hasDateRangeError() ? 'Check-out must be after check-in.' : ''"
  />

  <app-guests-picker
    [compact]="compact()"
    [adultsControl]="form.controls.adults"
    [childrenAgesArray]="form.controls.childrenAges"
    [petsArray]="form.controls.pets"
    [showAges]="true"
    [guestsError]="(hasError('adults', 'min') || hasError('adults', 'max')) ? 'Guest selection is out of allowed range.' : ''"
  />

  <button type="submit" class="search-button">{{ submitLabel() }}</button>

</form>
