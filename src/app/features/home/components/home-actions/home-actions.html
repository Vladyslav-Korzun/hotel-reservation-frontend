<section class="home-actions" aria-label="Reservation actions">
  <div>
    <p class="eyebrow">Hotel Reservation</p>
    <h2>Start with the stay, continue when you are ready.</h2>
  </div>

  <div class="home-actions__buttons">
    <a class="btn home-actions__primary" href="#stay-search">Search stays</a>

    @if (auth.isAuthenticated()) {
      @if (canSelfBook()) {
        <a class="btn home-actions__secondary" routerLink="/reservations/new">Create reservation</a>
      }
      <a class="btn home-actions__secondary" routerLink="/reservations/find">Find reservation</a>
    } @else {
      <a class="btn home-actions__secondary" routerLink="/stays/search">Reserve as guest</a>
    }
  </div>
</section>
