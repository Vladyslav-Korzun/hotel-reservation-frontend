<section class="travel-inspiration py-5" aria-label="Travel inspiration">
  <div class="container py-2 py-md-4">

    <div class="row justify-content-center mb-4 mb-md-5">
      <div class="col-12 col-lg-8 text-center">
        <p class="eyebrow mb-2">Explore</p>
        <h2 class="travel-inspiration__title mb-0">Find the right stay for your trip</h2>
      </div>
    </div>

    <div class="row g-3">
      @for (tile of tiles; track tile.title; let index = $index) {
        <div
          class="col-12 col-sm-6"
          [class.col-lg-8]="index === 0"
          [class.col-lg-4]="index !== 0"
        >
          <a
            class="inspiration-tile d-block text-decoration-none"
            routerLink="/stays/search"
            [attr.aria-label]="tile.title + ': Explore stays'"
            [style.background-image]="
              'linear-gradient(180deg, rgba(10,11,10,0.18) 0%, rgba(10,11,10,0.72) 100%), url(' + tile.imageUrl + ')'
            "
          >
            <div class="inspiration-tile__body p-4">
              <h3 class="inspiration-tile__title mb-2">{{ tile.title }}</h3>
              <p class="inspiration-tile__text mb-3">{{ tile.text }}</p>
              <span class="btn inspiration-tile__btn">Explore stays</span>
            </div>
          </a>
        </div>
      }
    </div>

  </div>
</section>
