<section id="stay-search" class="home-hero" aria-label="Stay search">
  <div class="home-hero__slides" aria-hidden="true">
    @for (slide of slides; track slide.imageUrl; let index = $index) {
      <div
        class="home-hero__slide"
        [class.home-hero__slide--active]="activeSlideIndex() === index"
        [style.background-image]="'linear-gradient(90deg, rgba(12, 13, 12, 0.72), rgba(12, 13, 12, 0.36)), linear-gradient(180deg, rgba(12, 13, 12, 0.3), rgba(12, 13, 12, 0.68)), url(' + slide.imageUrl + ')'"
      ></div>
    }
  </div>

  <app-hero-topbar />

  <div class="home-hero__content">
    <h1>Explore your place to stay</h1>

    <app-stay-search-form submitLabel="Search rooms" (submitted)="submitSearch($event)" />
  </div>

  <app-hero-note />
  <app-hero-dots
    [slidesCount]="slides.length"
    [activeIndex]="activeSlideIndex()"
    (slideSelected)="selectSlide($event)"
  />
</section>
