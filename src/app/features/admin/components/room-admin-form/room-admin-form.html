<form class="card admin-form dark-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="admin-form__header">
    <p class="eyebrow">Rooms</p>
    <h2>Create or update room</h2>
  </div>

  <div class="row g-3 admin-form__grid">
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Operation</span><select class="form-select" formControlName="mode"><option value="create">Create</option><option value="update">Update</option></select></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Path room id</span><input class="form-control" type="number" min="1" formControlName="pathRoomId" /></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Room id</span><input class="form-control" type="number" min="1" formControlName="roomId" /></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Hotel id</span><input class="form-control" type="number" min="1" formControlName="hotelId" /></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Room number</span><input class="form-control" formControlName="roomNumber" /></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Room type id</span><input class="form-control" type="number" min="1" formControlName="roomTypeId" /></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Capacity</span><input class="form-control" type="number" min="1" formControlName="capacity" /></label>
    <label class="col-12 col-md-6 col-xl-4 form-row"><span class="form-label">Status</span><select class="form-select" formControlName="status">@for (status of statuses; track status) { <option [value]="status">{{ status }}</option> }</select></label>
  </div>

  <button type="submit" class="btn btn-brand-light admin-form__submit" [disabled]="submitting()">Save room</button>
</form>
