@if (isOpen()) {
  <div
    class="photo-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photo gallery"
    (click)="close()"
  >
    <button
      type="button"
      class="photo-lightbox__close"
      aria-label="Close gallery"
      (click)="close()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M6 6l12 12M6 18L18 6"/>
      </svg>
    </button>

    <button
      type="button"
      class="photo-lightbox__nav photo-lightbox__nav--prev"
      aria-label="Previous photo"
      (click)="prev($event)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>

    <div class="photo-lightbox__stage" (click)="$event.stopPropagation()">
      <img
        class="photo-lightbox__image"
        [src]="currentImage()"
        [alt]="altPrefix() + ' ' + counterLabel()"
      />
      <div class="photo-lightbox__counter serif-heading">{{ counterLabel() }}</div>
    </div>

    <button
      type="button"
      class="photo-lightbox__nav photo-lightbox__nav--next"
      aria-label="Next photo"
      (click)="next($event)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </button>
  </div>
}
