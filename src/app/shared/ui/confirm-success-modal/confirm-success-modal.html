<div class="csm-overlay" role="presentation" (click)="onBackdropClick($event)">
  <div class="csm" role="dialog" aria-modal="true" [attr.aria-labelledby]="'csm-title'">

    <div class="csm__check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12l5 5L20 7"/>
      </svg>
    </div>

    <h2 id="csm-title" class="serif-heading">{{ title() }}</h2>
    <p class="csm__sub">{{ subtitle() }}</p>


    <div class="csm__actions">
      <button type="button" class="csm__primary" (click)="primaryAction.emit()">
        {{ primaryLabel() }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
      <button type="button" class="csm__secondary" (click)="secondaryAction.emit()">
        {{ secondaryLabel() }}
      </button>
    </div>

    <p class="csm__note serif-heading">{{ note() }}</p>

  </div>
</div>
