server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8080;
  server_name _;

  location /stub_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
  }
}
